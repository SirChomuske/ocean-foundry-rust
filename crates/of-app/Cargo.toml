[package]
name = "of-app"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
of-core = { version = "0.1.0", path = "../of-core" }
of-formats = { version = "0.1.0", path = "../of-formats" }
of-gpu = { version = "0.1.0", path = "../of-gpu" }
of-ocean = { version = "0.1.0", path = "../of-ocean" }
rfd = "0.18.0"

[features]
# The development build: lava (on hold) and the coast and cliffs lands.
# The package is built without them: the sea alone, on open sea or a
# brought-in build.
dev = ["of-ocean/dev", "of-core/dev"]
