[package]
name = "of-ocean"
version = "0.2.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
of-core = { version = "0.2.0", path = "../of-core" }
of-formats = { version = "0.2.0", path = "../of-formats" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
# The development build: lava (on hold) and the coast and cliffs lands.
# The package is built without them.
dev = ["of-core/dev"]

[dev-dependencies]
flate2 = "1.1.11"
